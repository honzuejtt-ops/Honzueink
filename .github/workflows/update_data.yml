name: Update E-paper Data
run-name: Update E-paper Data${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  schedule:
    - cron: '17 6,9,12,15,18,22 * * *'
      timezone: "Europe/Prague"
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID požadavku z HonzueINK"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v5

      - name: Priprava Pythonu
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalace knihoven
        run: python -m pip install -r requirements.txt

      - name: Spusteni Python skriptu
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          KALENDAR_ICS_URL: ${{ secrets.KALENDAR_ICS_URL }}
        run: python data_fetcher.py

      - name: Ulozeni a nahrani novych dat zpatky do repozitare
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo "Zadne zmeny" && exit 0
          git commit -m "Automatická aktualizace dat pro e-paper"
          git pull --rebase -X ours origin main
          git push
