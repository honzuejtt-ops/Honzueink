name: Update E-paper Data

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v5

      - name: Priprava Pythonu
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalace knihoven
        run: pip install requests beautifulsoup4 trafilatura

      - name: Spusteni Python skriptu
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python data_fetcher.py

      - name: Ulozeni a nahrani novych dat zpatky do repozitare
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo "Zadne zmeny" && exit 0
          git commit -m "Automatická aktualizace dat pro e-paper"
          git pull --rebase -X ours origin main
          git push
